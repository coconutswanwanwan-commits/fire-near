<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        消防ヒヤリハット共有システム
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        .featured-section {
            border: 2px solid #ef6c00;
            background: #fff8e1;
        }

        .featured-card {
            padding: 15px 0;
            border-bottom: 1px solid #ffcc80;
        }

        .featured-card:last-child {
            border-bottom: none;
        }

        .featured-title {
            display: block;
            margin-bottom: 8px;
            color: #e65100;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
        }

        .featured-info {
            color: #555;
            line-height: 1.7;
        }


        /* 人気事例 */
        .ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 5px;
            border-bottom: 1px solid #e0e0e0;
        }

        .ranking-item:last-child {
            border-bottom: none;
        }

        .ranking-number {
            min-width: 42px;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
        }

        .ranking-content {
            flex: 1;
            min-width: 0;
        }

        .ranking-title {
            display: block;
            color: #0d47a1;
            font-weight: bold;
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        .ranking-info {
            margin-top: 5px;
            color: #666;
            font-size: 0.9rem;
            overflow-wrap: anywhere;
        }

        .ranking-helpful {
            flex-shrink: 0;
            padding: 7px 10px;
            border-radius: 20px;
            background: #eef5ff;
            color: #0d47a1;
            font-weight: bold;
            white-space: nowrap;
        }

        .ranking-message {
            padding: 15px 0;
            color: #666;
            text-align: center;
        }


        /* お知らせ */
        .notice-section {
            border-left: 6px solid #00838f;
        }

        .notice-section h2 {
            margin-bottom: 18px;
        }

        .notice-title {
            margin-bottom: 10px;
            color: #006064;
            font-size: 1.2rem;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .notice-body {
            margin: 0;
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: normal;
        }

        .notice-updated {
            margin-top: 14px;
            color: #777;
            font-size: 0.85rem;
            text-align: right;
        }

        .notice-loading,
        .notice-error {
            padding: 12px 0;
            color: #666;
        }

        .notice-error {
            color: #b71c1c;
        }


        .admin-link-area {
            margin-top: 20px;
            text-align: center;
        }

        .admin-link {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 20px;
            background: #eceff1;
            color: #455a64;
            font-size: 0.9rem;
            text-decoration: none;
        }


        /* スマホ表示 */
        @media (max-width: 600px) {

            .container {
                width: auto;
                margin-left: 12px;
                margin-right: 12px;
            }

            .news {
                padding-left: 18px;
                padding-right: 18px;
            }


            /* 人気事例 */
            .ranking-item {
                align-items: flex-start;
                gap: 9px;
                padding: 14px 0;
            }

            .ranking-number {
                min-width: 34px;
                font-size: 1.15rem;
            }

            .ranking-title {
                font-size: 1rem;
                line-height: 1.5;
            }

            .ranking-info {
                margin-top: 4px;
                font-size: 0.86rem;
                line-height: 1.5;
            }

            .ranking-helpful {
                padding: 6px 9px;
                font-size: 0.85rem;
            }


            /* お知らせ */
            .notice-section {
                padding-left: 18px;
                padding-right: 18px;
            }

            .notice-section h2 {
                margin-bottom: 14px;
            }

            .notice-title {
                margin-bottom: 8px;
                font-size: 1.05rem;
                line-height: 1.5;
            }

            .notice-body {
                width: 100%;
                max-width: none;
                margin: 0;
                padding: 0;
                font-size: 0.98rem;
                line-height: 1.75;
                text-align: left;
            }

            .notice-updated {
                margin-top: 12px;
                font-size: 0.8rem;
                text-align: right;
            }
        }


        /* かなり狭いスマホ */
        @media (max-width: 400px) {

            .container {
                margin-left: 8px;
                margin-right: 8px;
            }

            .news {
                padding-left: 14px;
                padding-right: 14px;
            }

            .notice-section {
                padding-left: 14px;
                padding-right: 14px;
            }

            .ranking-item {
                gap: 7px;
            }

            .ranking-number {
                min-width: 30px;
            }

            .ranking-helpful {
                padding: 5px 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>
            🚒 消防ヒヤリハット共有システム
        </h1>

        <p class="subTitle">
            Fire Near
        </p>
    </header>


    <section
        class="news featured-section"
        id="featuredSection"
        hidden
    >
        <h2>
            📌 重要事例
        </h2>

        <div id="featuredReports">
            読み込み中...
        </div>
    </section>


    <section class="today">

        <h2>
            本日の投稿件数
        </h2>

        <div
            class="count"
            id="todayCount"
        >
            読み込み中...
        </div>

        <p
            id="todayCountMessage"
            style="
                margin-top:8px;
                color:#666;
                font-size:0.9rem;
            "
        ></p>

    </section>


    <nav>

        <a
            href="post.html"
            class="menuButton"
        >
            📝<br>
            投稿する
        </a>


        <a
            href="cases.html"
            class="menuButton"
        >
            📚<br>
            事例を見る
        </a>


        <a
            href="list.html"
            class="menuButton"
        >
            🔍<br>
            検索する
        </a>


        <a
            href="stats.html"
            class="menuButton"
        >
            📊<br>
            統計を見る
        </a>


        <div style="text-align:center; margin:30px 0;">

            <a
                href="feedback.html"
                class="button"
            >
                🐞 不具合・改善要望はこちら
            </a>

        </div>

    </nav>


    <section class="news">

        <h2>
            🏆 人気事例 TOP5
        </h2>

        <div
            id="popularReports"
            class="ranking-message"
        >
            読み込み中...
        </div>

    </section>


    <section class="news notice-section">

        <h2>
            📢 お知らせ
        </h2>

        <div
            id="noticeContent"
            class="notice-loading"
        >
            お知らせを読み込み中...
        </div>

    </section>


    <div class="admin-link-area">

        <a
            href="admin.html"
            class="admin-link"
        >
            🔐 管理者ページ
        </a>

    </div>

</div>


<footer>

    Version 1.2.3

    <br>

    Developed by
    coconutswanwanwan-commits

</footer>


<script
    type="module"
    src="home.js?v=150"
></script>

</body>

</html>
