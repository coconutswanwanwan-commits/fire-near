<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ヒヤリハット詳細 | 消防ヒヤリハット共有システム
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .detail-section {
            margin-bottom: 22px;
        }

        .detail-section h3 {
            margin-bottom: 8px;
            color: #0d47a1;
        }

        .detail-text {
            white-space: pre-wrap;
            line-height: 1.7;
        }

        .helpful-area {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            background: #eef5ff;
            border-radius: 15px;
        }

        .helpful-count {
            margin-bottom: 12px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .helpful-button {
            width: 100%;
            max-width: 400px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #1565c0;
            color: white;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
        }

        .helpful-button:disabled {
            background: #8fa7c0;
            cursor: not-allowed;
        }

        .helpful-message {
            min-height: 24px;
            margin-top: 10px;
            color: #2e7d32;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <header>

        <h1>
            📄 ヒヤリハット詳細
        </h1>

        <p class="subTitle">
            事例の詳細情報です。
        </p>

    </header>


    <section
        class="news"
        id="detail"
    >
        読み込み中...
    </section>


    <section
        class="helpful-area"
        id="helpfulArea"
        hidden
    >

        <div
            class="helpful-count"
            id="helpfulCount"
        >
            参考になった：0件
        </div>

        <button
            type="button"
            id="helpfulButton"
            class="helpful-button"
        >
            👍 参考になった
        </button>

        <div
            id="helpfulMessage"
            class="helpful-message"
        >
        </div>

    </section>


    <div style="text-align:center; margin-top:20px;">

        <a href="list.html">
            ← 一覧へ戻る
        </a>

        ｜

        <a href="index.html">
            🏠 ホームへ戻る
        </a>

    </div>


    <footer>

        Version 0.5.0

    </footer>

</div>


<script
    type="module"
    src="detail.js"
></script>

</body>

</html>
