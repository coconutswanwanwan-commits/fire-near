<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        消防ヒヤリハット共有システム
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        .featured-section {
            border: 2px solid #ef6c00;
            background: #fff8e1;
        }

        .featured-card {
            padding: 15px 0;
            border-bottom: 1px solid #ffcc80;
        }

        .featured-card:last-child {
            border-bottom: none;
        }

        .featured-title {
            display: block;
            margin-bottom: 8px;
            color: #e65100;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
        }

        .featured-info {
            color: #555;
            line-height: 1.7;
        }

        .ranking-list {
            list-style: none;
            padding: 0;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 5px;
            border-bottom: 1px solid #e0e0e0;
        }

        .ranking-item:last-child {
            border-bottom: none;
        }

        .ranking-number {
            min-width: 42px;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
        }

        .ranking-content {
            flex: 1;
            min-width: 0;
        }

        .ranking-title {
            display: block;
            color: #0d47a1;
            font-weight: bold;
            text-decoration: none;
        }

        .ranking-info {
            margin-top: 5px;
            color: #666;
            font-size: 0.9rem;
        }

        .ranking-helpful {
            padding: 7px 10px;
            border-radius: 20px;
            background: #eef5ff;
            color: #0d47a1;
            font-weight: bold;
        }

        .ranking-message {
            padding: 15px 0;
            color: #666;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>
            🚒 消防ヒヤリハット共有システム
        </h1>

        <p class="subTitle">
            Fire Near
        </p>
    </header>


    <section
        class="news featured-section"
        id="featuredSection"
    >
        <h2>📌 重要事例</h2>

        <div id="featuredReports">
            読み込み中...
        </div>
    </section>


    <section class="today">
        <h2>本日の投稿件数</h2>

        <div
            class="count"
            id="todayCount"
        >
            読み込み中...
        </div>

        <p
            id="todayCountMessage"
            style="margin-top:8px; color:#666; font-size:0.9rem;"
        ></p>
    </section>


    <nav>
        <a
            href="post.html"
            class="menuButton"
        >
            📝<br>
            投稿する
        </a>

        <a
            href="cases.html"
            class="menuButton"
        >
            📚<br>
            事例を見る
        </a>

        <a
            href="list.html"
            class="menuButton"
        >
            🔍<br>
            検索する
        </a>

        <a
            href="stats.html"
            class="menuButton"
        >
            📊<br>
            統計を見る
        </a>
    </nav>


    <section class="news">
        <h2>🏆 人気事例 TOP5</h2>

        <div
            id="popularReports"
            class="ranking-message"
        >
            読み込み中...
        </div>
    </section>


    <section class="news">
        <h2>📢 お知らせ</h2>

        <ul>
            <li>
                Fire Nearへようこそ。
            </li>

            <li>
                気付いたヒヤリハットは積極的に共有しましょう。
            </li>

            <li>
                📌 重要事例を確認してください。
            </li>

            <li>
                🔍 検索・絞り込み機能を利用できます。
            </li>

            <li>
                📊 統計・CSV出力機能を利用できます。
            </li>
        </ul>
    </section>

</div>


<footer>
    Version 1.1.0

    <br>

    Developed by
    coconutswanwanwan-commits
</footer>


<script
    type="module"
    src="home.js?v=110"
></script>

</body>

</html>
